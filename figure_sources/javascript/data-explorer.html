<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>OpenScope data explorer</title>
  <style>
__DATA_EXPLORER_CSS__
  </style>
</head>
<body>
  <main class="explorer" id="data-explorer">
    <div class="view-switch" role="group" aria-label="Interactive or static view">
      <button type="button" class="view-button active" data-view="interactive" aria-pressed="true">Interactive</button>
      <button type="button" class="view-button" data-view="static" aria-pressed="false">Static</button>
    </div>

    <div id="interactive-view">
      <header class="explorer-header">
        <nav class="dataset-tabs" id="dataset-tabs" aria-label="Choose a data table"></nav>
        <p class="data-access-note" id="data-access-note" hidden>
          DANDI is the final-release archive. Public S3 links provide source and
          intermediate products; INTERNAL products are not publicly browsable.
        </p>
        <div class="table-tools" role="search">
          <input id="table-search" type="search" placeholder="Search animals" aria-label="Search table">
          <select id="modality-filter" aria-label="Filter by recording modality"></select>
          <select id="context-filter" aria-label="Filter by secondary category"></select>
          <output id="row-count" aria-live="polite"></output>
          <a id="download-csv" href="#" download title="Download visible rows as CSV" aria-label="Download visible rows as CSV">&#8595; CSV</a>
        </div>
      </header>

      <section class="table-shell" aria-live="polite">
        <table id="explorer-table">
          <thead><tr id="table-headers"></tr></thead>
          <tbody id="table-body"></tbody>
        </table>
        <p class="empty-state" id="empty-state" hidden>No matching rows.</p>
      </section>
    </div>

    <section class="static-view" id="static-view" aria-label="Static session inventory" hidden>
      <div class="static-shell">
        <img src="__SESSION_INVENTORY_IMAGE__" alt="Three panels showing Neuropixels, mesoscope, and SLAP2 sessions per mouse with context and QC status.">
      </div>
    </section>
  </main>

  <script id="explorer-data" type="application/json">__DATA_EXPLORER_DATA__</script>
  <script>
__DATA_EXPLORER_JS__
  </script>
  <script>
__EMBED_AUTO_HEIGHT_JS__
  </script>
</body>
</html>
