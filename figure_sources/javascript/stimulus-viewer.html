<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Predictive-processing stimulus viewer</title>
  <style>
__SIMULATOR_CSS__
  </style>
</head>
<body>
  <main class="viewer" id="stimulus-viewer">
    <div class="view-switch" role="group" aria-label="Interactive or static view">
      <button type="button" class="view-button active" data-view="playback" aria-pressed="true">Interactive</button>
      <button type="button" class="view-button" data-view="static" aria-pressed="false">Static</button>
    </div>

    <div id="playback-view">
      <section class="playback-bar" aria-label="Shared session architecture">
        <div class="context-selector" id="context-selector">
          <span class="context-selector-label">Select context block</span>
          <nav class="session-tabs" id="session-selector" aria-label="Stimulus context"></nav>
        </div>
        <div class="block-track" id="block-track" aria-label="Session blocks"></div>
        <div class="playback-meta">
          <time id="playback-time">00:00 / 00:24</time>
        </div>
      </section>

      <section class="screen-section" aria-labelledby="session-title">
        <header class="screen-heading">
          <h1 id="session-title">Standard oddball</h1>
          <span id="trial-label">Frequent standard 0 deg</span>
        </header>

        <div class="monitor-frame" id="screen-toggle">
          <canvas id="stimulus-canvas" width="480" height="380" role="img" aria-label="Reconstructed visual stimulus"></canvas>
          <video id="stimulus-video" muted loop playsinline preload="auto" poster="./zebra-stimulus-poster.png" hidden aria-label="Canonical zebra movie stimulus"></video>
          <span class="mismatch-badge" id="mismatch-badge" hidden>Mismatch</span>
          <button class="play-overlay" id="play-toggle" type="button" aria-label="Play stimulus" title="Play stimulus">
            <span id="play-icon" aria-hidden="true">&#9654;</span>
          </button>
        </div>
      </section>
    </div>

    <section class="static-panel" id="static-panel" aria-label="Static experimental-design summary" hidden>
      <img src="__PANEL_D_IMAGE__" alt="Two panels showing the shared session timeline and detailed context, control, receptive-field, and zebra-movie blocks.">
    </section>
  </main>

  <script id="simulator-data" type="application/json">__SIMULATOR_DATA__</script>
  <script>
__SIMULATOR_JS__
  </script>
  <script>
__EMBED_AUTO_HEIGHT_JS__
  </script>
</body>
</html>
