<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Raw data across recording modalities</title>
  <style>
__NEURAL_CSS__
  </style>
</head>
<body>
  <main class="viewer" id="neural-viewer">
    <nav class="modality-tabs" id="modality-selector" aria-label="Recording modality"></nav>

    <section class="toolbar" aria-label="Raw-data controls">
      <label for="option-select" id="option-label">Source</label>
      <select id="option-select"></select>
      <div class="contrast-control">
        <label for="contrast">Contrast</label>
        <input id="contrast" type="range" min="0.6" max="2.4" step="0.1" value="1" aria-label="Display contrast">
      </div>
    </section>

    <section class="visual-shell" aria-label="Event-aligned raw-data view">
      <canvas id="raw-canvas" width="900" height="520" role="img" tabindex="0" aria-label="Raw data aligned to event onset"></canvas>
      <div id="loading-status" class="loading-status" role="status" hidden>Loading raw frames</div>
      <div id="canvas-tooltip" class="canvas-tooltip" role="status" hidden></div>
    </section>

    <section class="transport" aria-label="Timeline controls">
      <button id="play-toggle" type="button" aria-label="Play raw-data excerpt" title="Play">
        <span id="play-icon" aria-hidden="true">&#9654;</span>
      </button>
      <div class="timeline-control">
        <input id="playhead" type="range" min="-1" max="3" step="0.001" value="-1" aria-label="Time from event onset">
        <div class="timeline-ticks" aria-hidden="true">
          <span>&minus;1</span>
          <span class="event-tick">0</span>
          <span>+1</span>
          <span>+2</span>
          <span>+3</span>
        </div>
        <div class="timeline-label">Time from event onset (s)</div>
      </div>
      <output id="playhead-time">-1.000 s</output>
    </section>
  </main>

  <script id="neural-data" type="application/json">__NEURAL_DATA__</script>
  <script>
__NEURAL_JS__
  </script>
  <script>
__EMBED_AUTO_HEIGHT_JS__
  </script>
</body>
</html>
