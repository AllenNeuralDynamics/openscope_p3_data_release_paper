<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Published oddball paradigms comparison</title>
  <style>
__LITERATURE_CSS__
  </style>
</head>
<body>
  <main class="viewer" id="literature-comparison">
    <header class="viewer-header">
      <nav class="mode-tabs" id="mode-tabs" aria-label="Comparison mode">
        <button type="button" class="mode-tab active" data-mode="parameter" aria-pressed="true">Compare parameter</button>
        <button type="button" class="mode-tab" data-mode="study" aria-pressed="false">Study profile</button>
      </nav>
      <div class="viewer-tools" role="search">
        <label class="select-label" for="dimension-select" id="dimension-label">Parameter</label>
        <select id="dimension-select" aria-labelledby="dimension-label"></select>
        <input id="row-search" type="search" placeholder="Filter studies" aria-label="Filter visible rows">
        <output id="row-count" aria-live="polite"></output>
        <a id="download-csv" href="#" download title="Download visible rows as CSV" aria-label="Download visible rows as CSV">&#8595; CSV</a>
      </div>
    </header>
    <section class="table-shell" aria-live="polite">
      <table id="comparison-table">
        <thead><tr id="table-headers"></tr></thead>
        <tbody id="table-body"></tbody>
      </table>
      <p class="empty-state" id="empty-state" hidden>No matching rows.</p>
    </section>
  </main>
  <script id="literature-data" type="application/json">__LITERATURE_DATA__</script>
  <script>
__LITERATURE_JS__
  </script>
  <script>
__EMBED_AUTO_HEIGHT_JS__
  </script>
</body>
</html>
