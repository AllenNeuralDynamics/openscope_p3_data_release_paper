name: Validate and deploy MyST publication

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  BASE_URL: /openscope_p3_data_release_paper

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Enable standard Windows line-ending conversion
        run: git config --global core.autocrlf true

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install Python package
        run: uv sync --locked --extra dev

      - name: Check snapshot line endings and checksums
        run: uv run pytest -q tests/test_publication.py::test_checksum_sensitive_snapshots_use_lf_line_endings tests/test_figures.py::test_animal_record_provenance tests/test_figures.py::test_svg_output_uses_lf_line_endings

      - name: Regenerate publication figures
        run: uv run build-publication-figures

      - name: Check generated figures are current
        run: git diff --exit-code -- interactive images/figures/generated figure_sources/media/optotagging/optotagging-static-composite.svg

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install Python package
        run: uv sync --locked --extra dev

      - name: Check Python
        run: uv run ruff check .

      - name: Test publication code
        run: uv run pytest

      - name: Regenerate interactive figures
        run: uv run build-publication-figures

      - name: Check generated figures are current
        run: git diff --exit-code -- interactive images/figures/generated figure_sources/media/optotagging/optotagging-static-composite.svg

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript figure sources
        run: |
          node --check figure_sources/javascript/stimulus-viewer.js
          node --check figure_sources/javascript/data-explorer.js
          node --check figure_sources/javascript/literature-comparison.js
          node --check figure_sources/javascript/behavior-viewer.js
          node --check figure_sources/javascript/segmentation-viewer.js
          node --check figure_sources/javascript/optotagging-heatmaps.js

      - name: Install MyST
        run: npm install --global mystmd@1.10.1

      - name: Build HTML publication
        run: myst build --html

      - name: Check interactive site assets
        run: |
          test -f _build/html/interactive/experimental-design.html
          test -f _build/html/interactive/data-explorer.html
          test -f _build/html/interactive/literature-comparison.html
          test -f _build/html/interactive/behavior-viewer.html
          test -f _build/html/interactive/segmentation-viewer.html
          test -f _build/html/interactive/optotagging-heatmaps.html
          test -f _build/html/interactive/media/optotagging/optotagging-heatmaps.svg
          test -f _build/html/interactive/zebra-stimulus-excerpt.m4v
          test -f _build/html/interactive/zebra-stimulus-poster.png

      - name: Configure Pages
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4