      id: "ali-shamsnia"
      name: "Ali Shamsnia"
      avatar_url: "https://lh7-us.googleusercontent.com/sitesv-images-rt/AMxu72vvG8ikymrocggo36Sd1jo8GWPgtzkuClqjSgljLOO-sLA6ZHxol92pKE7zXrs1IN1ae6dFkPNIw1CS034j9VAPfAX22cDxYe5Yz0CfWZuBHsasWHgyv1_SkoGVq6ZEP9oOSjK5nm9ocWbiLWAgNi4yvtEpYNjxype_TOLWbmiomIudq5dnvWvplBLkhYi04UfrNz5uQoKoQYk3YZiW2T6wTRlDzsRVfrWmFEyrSTM=w1280"
      orcid: "0009-0000-1137-6132"
      email: "alishamsniaaa@gmial.com"
      affiliations:
        - "Georgia Institute of Technology"
      roles:
        - "Methodology"
        - "Software"
      credit_levels:
        -
          role: "Methodology"
          level: "supporting"
          description: "Designed a validation-first quality-control framework for processed Mesoscope planar optical physiology sessions. Defined session- and plane-level QC criteria: ROI and putative-soma counts per plane, plausibility of ROI size and soma probability, robust dF/F statistics (percentiles, MAD, 5–95% range), slow-drift estimates, event rates and amplitudes, missing values and timestamp integrity, and neuropil-to-raw fluorescence ratios. Also set a data-access strategy: stream from S3 for first-pass checks, and download locally only for full-session analysis."
        -
          role: "Software"
          level: "supporting"
          description: "Developed the initial open-source Python QC toolkit (github.com/Alishamsnia/Allen_OpenScope_Ophys_QC). It includes a command-line pipeline that streams processed NWB/Zarr sessions directly from the public aind-open-data S3 bucket, extracts plane and ROI metadata, computes trace and event QC metrics, and exports CSV/JSON summaries and diagnostic plots. It also includes a notebook for interactive inspection of session metadata, ROI tables and dF/F traces, and both tools support partial-frame loading for fast first-pass checks of large sessions."
      section_contributions:
        -
          section: "Mesoscope data validation"
          effort: "supporting"
