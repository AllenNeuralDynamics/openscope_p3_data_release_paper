<svg xmlns="http://www.w3.org/2000/svg" width="900" height="690" viewBox="0 0 900 690" role="img" aria-labelledby="title description">
<title id="title">Mesoscope laser power by imaging depth</title>
<desc id="description">Minimum and maximum laser power lookup ranges for twelve contiguous 50 micrometer imaging-depth intervals from the cortical surface to 600 micrometers.</desc>
