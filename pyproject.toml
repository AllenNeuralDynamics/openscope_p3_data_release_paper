[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openscope-p3-publication"
version = "0.1.0"
description = "Reproducible figure and publication tooling for the OpenScope predictive processing data release"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "plotly>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
build-publication-figures = "openscope_p3_publication.figures:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openscope_p3_publication"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]