<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Synchronized behavior across recording modalities</title>
  <style>
:root {
  --figure-font-sans: "Myriad Pro", Arial, sans-serif;
  --figure-font-mono: "IBM Plex Mono", monospace;
  --figure-type-panel-title: 1.25rem;
  --figure-type-section-title: 1rem;
  --figure-type-body: 0.875rem;
  --figure-type-control: 0.8125rem;
  --figure-type-metadata: 0.75rem;
  --figure-type-axis: 0.75rem;
  --figure-line-body: 1.45;
  --figure-line-compact: 1.3;
}

body {
  font-family: var(--figure-font-sans);
  font-size: var(--figure-type-body);
  line-height: var(--figure-line-body);
}

button,
input,
select {
  font-family: inherit;
  font-size: var(--figure-type-control);
}

@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap");

:root {
  color-scheme: light;
  --accent: #283185;
  --ink: #303536;
  --muted: #707674;
  --line: #d0d4d2;
  --soft-line: #e5e7e6;
  --wash: #f6f7f7;
  --paper: #fff;
}

* { box-sizing: border-box; }

html,
body {
  margin: 0;
  min-width: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Myriad Pro", Arial, sans-serif;
}

button,
input { font: inherit; }

button:focus-visible,
input:focus-visible,
a:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--accent) 24%, transparent);
  outline-offset: 2px;
}

.viewer {
  width: 100%;
  min-height: 100vh;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--paper);
}

html.is-embedded .viewer { min-height: 0; }

.view-switch {
  width: max-content;
  display: grid;
  grid-template-columns: repeat(2, auto);
  margin: 10px auto;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: #fff;
}

.view-button {
  min-width: 112px;
  min-height: 38px;
  padding: 6px 16px;
  border: 0;
  border-right: 1px solid var(--line);
  background: #fff;
  color: var(--muted);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
}

.view-button:last-child { border-right: 0; }
.view-button.active { background: #30383c; color: #fff; }

.static-view[hidden],
#interactive-view[hidden] { display: none !important; }

.static-shell {
  width: 100%;
  overflow: auto;
  border-top: 1px solid var(--line);
  background: #fff;
}

.static-shell img {
  width: 100%;
  min-width: 1000px;
  height: auto;
  display: block;
}

.modality-tabs {
  min-height: 62px;
  display: flex;
  align-items: stretch;
  gap: 3px;
  padding: 0 14px;
  border-bottom: 1px solid var(--line);
  background: #f7f8f8;
}

.modality-tab {
  position: relative;
  min-height: 61px;
  padding: 0 14px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 0;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-weight: 650;
}

.modality-logo {
  width: 42px;
  height: 42px;
  flex: 0 0 42px;
  object-fit: contain;
}

.modality-tab::after {
  position: absolute;
  right: 13px;
  bottom: -1px;
  left: 13px;
  height: 3px;
  background: transparent;
  content: "";
}

.modality-tab.active { color: var(--ink); }
.modality-tab.active::after { background: var(--accent); }

.session-header {
  min-height: 80px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
}

.context-label {
  margin: 0 0 2px;
  color: var(--accent);
  font-size: var(--figure-type-metadata);
  font-weight: 700;
}

.session-header h1 {
  margin: 0;
  font-size: var(--figure-type-section-title);
  font-weight: 650;
  letter-spacing: 0;
  line-height: 1.25;
}

.source-links {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 6px;
}

.source-links a {
  min-height: 28px;
  padding: 4px 8px;
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--wash);
  color: #496375;
  font-family: "IBM Plex Mono", monospace;
  font-size: var(--figure-type-metadata);
  font-weight: 500;
  text-decoration: none;
}

.source-links a:hover { background: #ecefee; }

.media-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.7fr) minmax(245px, 0.72fr);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.camera-panel { min-width: 0; }

.camera-tabs {
  min-height: 38px;
  padding: 5px 8px;
  display: flex;
  gap: 4px;
  overflow-x: auto;
  border-bottom: 1px solid #3f4544;
  background: #242827;
  scrollbar-width: thin;
}

.camera-tab {
  min-width: 74px;
  padding: 4px 10px;
  border: 1px solid #565c5a;
  border-radius: 4px;
  background: transparent;
  color: #cbd0ce;
  cursor: pointer;
  font-size: var(--figure-type-control);
  font-weight: 600;
}

.camera-tab.active {
  border-color: #fff;
  background: #fff;
  color: #242827;
}

.video-stage {
  position: relative;
  min-height: 310px;
  aspect-ratio: 658 / 492;
  overflow: hidden;
  background: #171a19;
}

#behavior-video {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  background: #171a19;
}

.video-overlay {
  position: absolute;
  z-index: 2;
  right: 10px;
  left: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  pointer-events: none;
  color: #fff;
  font-size: var(--figure-type-metadata);
  font-weight: 600;
  text-shadow: 0 1px 3px #000;
}

.video-overlay-top { top: 9px; }

.stream-status {
  padding: 3px 6px;
  border: 1px solid rgba(255, 255, 255, 0.55);
  border-radius: 3px;
  background: rgba(20, 23, 22, 0.72);
  font-family: "IBM Plex Mono", monospace;
  font-size: var(--figure-type-metadata);
  text-shadow: none;
}

.video-unavailable {
  position: absolute;
  inset: 0;
  padding: 24px;
  display: grid;
  place-content: center;
  gap: 4px;
  background: #222625;
  color: #fff;
  text-align: center;
}

.video-unavailable[hidden] { display: none; }
.video-unavailable span { color: #bfc5c2; font-size: var(--figure-type-metadata); }

.event-badge {
  position: absolute;
  z-index: 3;
  top: 42px;
  left: 10px;
  padding: 3px 7px;
  border-radius: 3px;
  background: #fff;
  color: #9d352b;
  font-size: var(--figure-type-metadata);
  font-weight: 700;
}

.stimulus-panel {
  min-width: 0;
  padding: 12px;
  border-left: 1px solid var(--line);
  background: var(--wash);
}

.panel-heading {
  min-height: 28px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}

.panel-heading h2 {
  margin: 0;
  font-size: var(--figure-type-section-title);
  font-weight: 700;
  letter-spacing: 0;
}

#trial-type,
#trace-unit {
  color: var(--muted);
  font-size: var(--figure-type-metadata);
}

#stimulus-canvas {
  width: 100%;
  height: auto;
  display: block;
  border: 1px solid #c5c9c7;
  background: #777;
}

.stimulus-details {
  margin: 9px 0 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px 10px;
}

.stimulus-details div { min-width: 0; }
.stimulus-details dt { color: var(--muted); font-size: var(--figure-type-metadata); }
.stimulus-details dd {
  margin: 1px 0 0;
  overflow: hidden;
  color: var(--ink);
  font-family: "IBM Plex Mono", monospace;
  font-size: var(--figure-type-metadata);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.transport {
  min-height: 50px;
  padding: 8px 12px;
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--line);
}

#play-toggle {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 1px solid #474d4b;
  border-radius: 50%;
  background: #303536;
  color: #fff;
  cursor: pointer;
}

#timeline {
  width: 100%;
  accent-color: var(--accent);
}

#playback-time {
  min-width: 112px;
  color: var(--muted);
  font-family: "IBM Plex Mono", monospace;
  font-size: var(--figure-type-metadata);
  text-align: right;
}

.trace-panel { padding: 10px 12px 8px; }
.trace-heading { min-height: 34px; }
.trace-heading > div { display: flex; align-items: baseline; gap: 7px; }

#trace-value {
  color: var(--accent);
  font-family: "IBM Plex Mono", monospace;
  font-size: var(--figure-type-metadata);
  font-weight: 500;
}

#trace-canvas {
  width: 100%;
  height: 145px;
  display: block;
}

.event-key {
  min-height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  color: var(--muted);
  font-size: var(--figure-type-metadata);
}

.event-line {
  width: 2px;
  height: 14px;
  display: inline-block;
  background: #b44235;
}

@media (max-width: 560px) {
  .modality-tabs { padding: 0 7px; }
  .modality-tab { min-width: 0; flex: 1; gap: 4px; padding: 0 6px; font-size: var(--figure-type-control); }
  .modality-logo { width: 32px; height: 32px; flex-basis: 32px; }
  .session-header { padding: 10px; align-items: flex-start; flex-direction: column; gap: 8px; }
  .source-links { justify-content: flex-start; }
  .media-grid { grid-template-columns: 1fr; }
  .video-stage { min-height: 0; }
  .stimulus-panel { border-top: 1px solid var(--line); border-left: 0; }
  #stimulus-canvas { max-height: 190px; object-fit: cover; }
  .transport { grid-template-columns: 34px minmax(0, 1fr); }
  #playback-time { grid-column: 1 / -1; min-width: 0; text-align: center; }
  #trace-canvas { height: 130px; }
}
  </style>
</head>
<body>
  <main class="viewer" id="behavior-viewer">
    <div class="view-switch" role="group" aria-label="Interactive or static view">
      <button type="button" class="view-button active" data-view="interactive" aria-pressed="true">Interactive</button>
      <button type="button" class="view-button" data-view="static" aria-pressed="false">Static</button>
    </div>

    <div id="interactive-view">
      <nav class="modality-tabs" id="modality-selector" aria-label="Recording modality"></nav>

      <header class="session-header">
      <div class="session-identity">
        <p class="context-label" id="context-label"></p>
        <h1 id="session-title"></h1>
      </div>
      <div class="source-links" id="source-links" aria-label="Data sources"></div>
      </header>

      <section class="media-grid" aria-label="Synchronized recording excerpt">
      <div class="camera-panel">
        <div class="camera-tabs" id="camera-selector" aria-label="Behavior camera"></div>
        <div class="video-stage">
          <video id="behavior-video" muted playsinline preload="metadata" aria-label="Recorded behavior video"></video>
          <div class="video-overlay video-overlay-top">
            <span id="camera-label"></span>
            <span class="stream-status" id="stream-status" role="status">Loading S3 stream</span>
          </div>
          <div class="video-unavailable" id="video-unavailable" hidden>
            <strong>Video stream unavailable</strong>
            <span>The synchronized trace and stimulus remain active.</span>
          </div>
          <span class="event-badge" id="event-badge" hidden>Mismatch</span>
        </div>
      </div>

      <aside class="stimulus-panel" aria-labelledby="stimulus-heading">
        <div class="panel-heading">
          <h2 id="stimulus-heading">Stimulus</h2>
          <span id="trial-type"></span>
        </div>
        <canvas id="stimulus-canvas" width="360" height="225" role="img" aria-label="Reconstructed visual stimulus at the current recording time"></canvas>
        <dl class="stimulus-details">
          <div><dt>Trial</dt><dd id="trial-number">-</dd></div>
          <div><dt>Orientation</dt><dd id="orientation-value">-</dd></div>
          <div><dt>Spatial freq.</dt><dd id="spatial-frequency">-</dd></div>
          <div><dt>Temporal freq.</dt><dd id="temporal-frequency">-</dd></div>
        </dl>
      </aside>
      </section>

      <section class="transport" aria-label="Playback controls">
      <button id="play-toggle" type="button" aria-label="Play synchronized excerpt" title="Play">
        <span id="play-icon" aria-hidden="true">&#9654;</span>
      </button>
      <input id="timeline" type="range" min="0" max="16" step="0.01" value="0" aria-label="Excerpt time">
      <time id="playback-time">00:00.0 / 00:16.0</time>
      </section>

      <section class="trace-panel" aria-labelledby="trace-heading">
      <div class="panel-heading trace-heading">
        <div>
          <h2 id="trace-heading">Running speed</h2>
          <span id="trace-unit"></span>
        </div>
        <output id="trace-value" aria-live="off"></output>
      </div>
      <canvas id="trace-canvas" width="1200" height="190" role="img" aria-label="Wheel recording trace with synchronized playback cursor"></canvas>
      <div class="event-key">
        <span class="event-line" aria-hidden="true"></span>
        <span id="event-label"></span>
      </div>
      </section>
    </div>

    <section class="static-view" id="static-view" aria-label="Static synchronized behavior overview" hidden>
      <div class="static-shell">
        <img src="media/behavior-viewer/synchronized-behavior.svg" alt="Static rows showing camera views and full-session block-annotated running profiles from the same mice, followed by one shared-axis comparison of mouse-level mean running speed across modalities and protocol blocks.">
      </div>
    </section>
  </main>

  <script>
(() => {
  "use strict";

  const protocol = JSON.parse(document.getElementById("behavior-data").textContent);
  const elements = {
    cameraLabel: document.getElementById("camera-label"),
    cameraSelector: document.getElementById("camera-selector"),
    contextLabel: document.getElementById("context-label"),
    eventBadge: document.getElementById("event-badge"),
    eventLabel: document.getElementById("event-label"),
    modalitySelector: document.getElementById("modality-selector"),
    interactiveView: document.getElementById("interactive-view"),
    orientationValue: document.getElementById("orientation-value"),
    playIcon: document.getElementById("play-icon"),
    playToggle: document.getElementById("play-toggle"),
    playbackTime: document.getElementById("playback-time"),
    sessionTitle: document.getElementById("session-title"),
    sourceLinks: document.getElementById("source-links"),
    spatialFrequency: document.getElementById("spatial-frequency"),
    staticView: document.getElementById("static-view"),
    stimulusCanvas: document.getElementById("stimulus-canvas"),
    streamStatus: document.getElementById("stream-status"),
    temporalFrequency: document.getElementById("temporal-frequency"),
    timeline: document.getElementById("timeline"),
    traceCanvas: document.getElementById("trace-canvas"),
    traceHeading: document.getElementById("trace-heading"),
    traceUnit: document.getElementById("trace-unit"),
    traceValue: document.getElementById("trace-value"),
    trialNumber: document.getElementById("trial-number"),
    trialType: document.getElementById("trial-type"),
    video: document.getElementById("behavior-video"),
    videoUnavailable: document.getElementById("video-unavailable"),
    viewButtons: document.querySelectorAll(".view-button"),
  };
  const state = {
    cameraIndex: 0,
    localTime: 0,
    playing: false,
    sessionIndex: 0,
    view: "interactive",
    videoToken: 0,
  };
  const contextColors = {
    "Sensorimotor mismatch": "#283185",
    "Standard oddball": "#22bcad",
    "Sequence mismatch": "#b16027",
    "Duration mismatch": "#ccaf2d",
  };

  function currentSession() {
    return protocol.sessions[state.sessionIndex];
  }

  function currentCamera() {
    return currentSession().cameras[state.cameraIndex];
  }

  function selectView(view) {
    state.view = view;
    if (view === "static") pause();
    elements.interactiveView.hidden = view !== "interactive";
    elements.staticView.hidden = view !== "static";
    elements.viewButtons.forEach((button) => {
      const active = button.dataset.view === view;
      button.classList.toggle("active", active);
      button.setAttribute("aria-pressed", String(active));
    });
  }

  function videoTimeAt(localTime, camera = currentCamera()) {
    const mapping = camera.timeMap;
    if (localTime <= mapping[0][0]) return mapping[0][1];
    if (localTime >= mapping[mapping.length - 1][0]) return mapping[mapping.length - 1][1];
    let low = 0;
    let high = mapping.length - 1;
    while (low + 1 < high) {
      const middle = Math.floor((low + high) / 2);
      if (mapping[middle][0] <= localTime) low = middle;
      else high = middle;
    }
    const first = mapping[low];
    const second = mapping[high];
    const fraction = second[0] === first[0]
      ? 0
      : (localTime - first[0]) / (second[0] - first[0]);
    return first[1] + (second[1] - first[1]) * fraction;
  }

  function localTimeAt(videoTime, camera = currentCamera()) {
    const mapping = camera.timeMap;
    if (videoTime <= mapping[0][1]) return mapping[0][0];
    if (videoTime >= mapping[mapping.length - 1][1]) return mapping[mapping.length - 1][0];
    let low = 0;
    let high = mapping.length - 1;
    while (low + 1 < high) {
      const middle = Math.floor((low + high) / 2);
      if (mapping[middle][1] <= videoTime) low = middle;
      else high = middle;
    }
    const first = mapping[low];
    const second = mapping[high];
    const fraction = second[1] === first[1]
      ? 0
      : (videoTime - first[1]) / (second[1] - first[1]);
    return first[0] + (second[0] - first[0]) * fraction;
  }

  function formatTime(seconds) {
    const bounded = Math.max(0, Math.min(protocol.durationSeconds, seconds));
    const whole = Math.floor(bounded);
    const tenths = Math.floor((bounded - whole) * 10);
    return `00:${String(whole).padStart(2, "0")}.${tenths}`;
  }

  function buildModalityTabs() {
    protocol.sessions.forEach((session, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "modality-tab";
      const logo = document.createElement("img");
      logo.className = "modality-logo";
      logo.src = session.logo;
      logo.alt = "";
      logo.width = 42;
      logo.height = 42;
      button.append(logo, session.label);
      button.setAttribute("aria-label", `${session.label}, mouse ${session.subject}`);
      button.addEventListener("click", () => selectSession(index));
      elements.modalitySelector.append(button);
    });
  }

  function buildCameraTabs() {
    elements.cameraSelector.replaceChildren();
    currentSession().cameras.forEach((camera, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "camera-tab";
      button.textContent = camera.label;
      button.setAttribute("aria-label", `${camera.label} camera`);
      button.addEventListener("click", () => selectCamera(index));
      elements.cameraSelector.append(button);
    });
    updateCameraTabs();
  }

  function updateCameraTabs() {
    elements.cameraSelector.querySelectorAll("button").forEach((button, index) => {
      const active = index === state.cameraIndex;
      button.classList.toggle("active", active);
      button.setAttribute("aria-pressed", String(active));
    });
  }

  function renderSourceLinks() {
    elements.sourceLinks.replaceChildren();
    currentSession().sourceLinks.forEach((source) => {
      const link = document.createElement("a");
      link.href = source.url;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = source.label;
      elements.sourceLinks.append(link);
    });
  }

  function selectSession(index) {
    pause();
    state.sessionIndex = index;
    state.cameraIndex = 0;
    state.localTime = 0;
    const session = currentSession();
    document.documentElement.style.setProperty(
      "--accent",
      contextColors[session.context] || "#496375",
    );
    elements.modalitySelector.querySelectorAll("button").forEach((button, buttonIndex) => {
      const active = buttonIndex === index;
      button.classList.toggle("active", active);
      button.setAttribute("aria-pressed", String(active));
    });
    elements.contextLabel.textContent = session.context;
    elements.sessionTitle.textContent = `Mouse ${session.subject} · ${session.session}`;
    elements.traceHeading.textContent = session.traceLabel;
    elements.traceUnit.textContent = session.traceUnit;
    elements.eventLabel.textContent = `${session.event.label} · ${formatTime(session.event.time)}`;
    renderSourceLinks();
    buildCameraTabs();
    loadCamera();
    render();
  }

  function selectCamera(index) {
    const wasPlaying = state.playing;
    elements.video.pause();
    state.cameraIndex = index;
    updateCameraTabs();
    loadCamera(wasPlaying);
  }

  function loadCamera(resume = false) {
    const camera = currentCamera();
    const token = ++state.videoToken;
    elements.cameraLabel.textContent = `${camera.label} camera · public S3`;
    elements.streamStatus.textContent = "Loading S3 stream";
    elements.videoUnavailable.hidden = true;
    elements.video.src = camera.url;
    elements.video.load();

    const seek = () => {
      if (token !== state.videoToken) return;
      elements.video.currentTime = videoTimeAt(state.localTime, camera);
    };
    const ready = () => {
      if (token !== state.videoToken) return;
      elements.streamStatus.textContent = "S3 stream ready";
      elements.videoUnavailable.hidden = true;
      if (resume) play();
    };
    elements.video.addEventListener("loadedmetadata", seek, { once: true });
    elements.video.addEventListener("seeked", ready, { once: true });
  }

  function videoFailed() {
    elements.streamStatus.textContent = "S3 stream unavailable";
    elements.videoUnavailable.hidden = false;
    pause();
  }

  function seek(localTime) {
    state.localTime = Math.max(0, Math.min(protocol.durationSeconds, localTime));
    if (elements.video.readyState >= 1) {
      elements.video.currentTime = videoTimeAt(state.localTime);
    }
    render();
  }

  async function play() {
    if (state.localTime >= protocol.durationSeconds - 0.02) seek(0);
    state.playing = true;
    updatePlayState();
    try {
      await elements.video.play();
    } catch {
      state.playing = false;
      updatePlayState();
    }
    requestAnimationFrame(tick);
  }

  function pause() {
    state.playing = false;
    elements.video.pause();
    updatePlayState();
  }

  function togglePlay() {
    if (state.playing) pause();
    else play();
  }

  function updatePlayState() {
    elements.playIcon.innerHTML = state.playing ? "&#10074;&#10074;" : "&#9654;";
    elements.playToggle.setAttribute(
      "aria-label",
      state.playing ? "Pause synchronized excerpt" : "Play synchronized excerpt",
    );
    elements.playToggle.title = state.playing ? "Pause" : "Play";
  }

  function tick() {
    if (!state.playing) return;
    if (elements.video.readyState >= 2) {
      state.localTime = localTimeAt(elements.video.currentTime);
    } else {
      state.localTime += 1 / 60;
    }
    if (state.localTime >= protocol.durationSeconds) {
      seek(protocol.durationSeconds);
      pause();
      return;
    }
    render();
    requestAnimationFrame(tick);
  }

  function activeStimulus() {
    return currentSession().stimulus.find(
      (row) => row.start <= state.localTime && state.localTime < row.end,
    );
  }

  function drawStimulus(row) {
    const canvas = elements.stimulusCanvas;
    const context = canvas.getContext("2d");
    if (!row) {
      context.fillStyle = "#777";
      context.fillRect(0, 0, canvas.width, canvas.height);
      elements.trialType.textContent = "Inter-stimulus interval";
      elements.trialNumber.textContent = "-";
      elements.orientationValue.textContent = "gray";
      elements.spatialFrequency.textContent = "-";
      elements.temporalFrequency.textContent = "-";
      elements.eventBadge.hidden = true;
      return;
    }

    const image = context.createImageData(canvas.width, canvas.height);
    const angle = row.orientationDegrees * Math.PI / 180;
    const cosine = Math.cos(angle);
    const sine = Math.sin(angle);
    const elapsed = Math.max(0, state.localTime - row.start);
    const phase = row.phaseCycles - elapsed * row.temporalFrequency;
    for (let y = 0; y < canvas.height; y += 1) {
      const yDegrees = (y / canvas.height - 0.5) * 95;
      for (let x = 0; x < canvas.width; x += 1) {
        const xDegrees = (x / canvas.width - 0.5) * 120;
        const coordinate = xDegrees * cosine + yDegrees * sine;
        const luminance = Math.round(
          128 + 127 * row.contrast * Math.cos(2 * Math.PI * (coordinate * row.spatialFrequency + phase)),
        );
        const pixel = (y * canvas.width + x) * 4;
        image.data[pixel] = luminance;
        image.data[pixel + 1] = luminance;
        image.data[pixel + 2] = luminance;
        image.data[pixel + 3] = 255;
      }
    }
    context.putImageData(image, 0, 0);

    const trialType = row.trialType.replaceAll("_", " ");
    const mismatch = row.trialType !== "standard";
    elements.trialType.textContent = trialType;
    elements.trialNumber.textContent = row.trialNumber;
    elements.orientationValue.textContent = `${row.orientationDegrees.toFixed(0)} deg`;
    elements.spatialFrequency.textContent = `${row.spatialFrequency.toFixed(2)} cyc/deg`;
    elements.temporalFrequency.textContent = `${row.temporalFrequency.toFixed(1)} Hz`;
    elements.eventBadge.textContent = mismatch ? "Mismatch" : "Standard";
    elements.eventBadge.hidden = !mismatch;
  }

  function interpolatedTraceValue(trace, time) {
    const index = Math.min(trace.length - 2, Math.max(0, Math.floor(time * 20)));
    const first = trace[index];
    const second = trace[index + 1];
    const fraction = second[0] === first[0] ? 0 : (time - first[0]) / (second[0] - first[0]);
    return first[1] + (second[1] - first[1]) * Math.max(0, Math.min(1, fraction));
  }

  function drawTrace() {
    const session = currentSession();
    const trace = session.trace;
    const canvas = elements.traceCanvas;
    const context = canvas.getContext("2d");
    const margins = { bottom: 24, left: 58, right: 18, top: 16 };
    const width = canvas.width - margins.left - margins.right;
    const height = canvas.height - margins.top - margins.bottom;
    const values = trace.map((point) => point[1]);
    const maximum = Math.max(1, ...values.map((value) => Math.abs(value))) * 1.08;
    const x = (time) => margins.left + time / protocol.durationSeconds * width;
    const y = (value) => margins.top + (maximum - value) / (2 * maximum) * height;

    context.clearRect(0, 0, canvas.width, canvas.height);
    context.fillStyle = "#fff";
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.strokeStyle = "#e2e5e3";
    context.lineWidth = 1;
    for (const fraction of [0, 0.5, 1]) {
      const gridY = margins.top + fraction * height;
      context.beginPath();
      context.moveTo(margins.left, gridY);
      context.lineTo(canvas.width - margins.right, gridY);
      context.stroke();
    }

    context.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent");
    context.lineWidth = 2;
    context.beginPath();
    trace.forEach((point, index) => {
      if (index === 0) context.moveTo(x(point[0]), y(point[1]));
      else context.lineTo(x(point[0]), y(point[1]));
    });
    context.stroke();

    context.strokeStyle = "#b44235";
    context.lineWidth = 2;
    context.beginPath();
    context.moveTo(x(session.event.time), margins.top);
    context.lineTo(x(session.event.time), margins.top + height);
    context.stroke();

    context.strokeStyle = "#202322";
    context.lineWidth = 2;
    context.beginPath();
    context.moveTo(x(state.localTime), margins.top);
    context.lineTo(x(state.localTime), margins.top + height);
    context.stroke();

    context.fillStyle = "#707674";
    context.font = "12px IBM Plex Mono, monospace";
    context.textAlign = "right";
    context.fillText(maximum.toFixed(0), margins.left - 7, margins.top + 4);
    context.fillText("0", margins.left - 7, y(0) + 4);
    context.fillText((-maximum).toFixed(0), margins.left - 7, margins.top + height + 4);
    context.textAlign = "center";
    for (const time of [0, 4, 8, 12, 16]) {
      context.fillText(`${time}s`, x(time), canvas.height - 5);
    }

    const value = interpolatedTraceValue(trace, state.localTime);
    elements.traceValue.textContent = `${value.toFixed(1)} ${session.traceUnit}`;
  }

  function render() {
    elements.timeline.value = state.localTime;
    elements.playbackTime.textContent = `${formatTime(state.localTime)} / ${formatTime(protocol.durationSeconds)}`;
    drawStimulus(activeStimulus());
    drawTrace();
  }

  elements.video.addEventListener("error", videoFailed);
  elements.video.addEventListener("ended", pause);
  elements.playToggle.addEventListener("click", togglePlay);
  elements.timeline.addEventListener("input", (event) => seek(Number(event.target.value)));
  elements.timeline.addEventListener("change", () => {
    if (state.playing) play();
  });
  elements.viewButtons.forEach((button) => {
    button.addEventListener("click", () => selectView(button.dataset.view));
  });

  elements.timeline.max = protocol.durationSeconds;
  buildModalityTabs();
  selectView("interactive");
  selectSession(0);
})();
  </script>
  <script>
(() => {
  "use strict";

  const root = document.querySelector("body > main");
  if (!root || window.self === window.top) return;

  let wrapper;
  try {
    wrapper = window.frameElement?.parentElement;
  } catch {
    return;
  }
  if (!wrapper) return;

  document.documentElement.classList.add("is-embedded");
  document.documentElement.style.overflow = "hidden";
  document.body.style.overflow = "hidden";
  const syncHeight = () => {
    const height = Math.ceil(root.getBoundingClientRect().height);
    if (height > 0) wrapper.style.height = `${height}px`;
  };
  const resizeObserver = new ResizeObserver(syncHeight);
  resizeObserver.observe(root);
  window.addEventListener("resize", syncHeight);
  window.addEventListener("load", syncHeight, { once: true });
  syncHeight();
})();
  </script>
</body>
