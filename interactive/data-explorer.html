<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>OpenScope data explorer</title>
  <style>
@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Source+Sans+3:wght@400;500;600;700&display=swap");

:root {
  color-scheme: light;
  --ink: #303536;
  --muted: #6e7472;
  --line: #d0d4d2;
  --soft-line: #e4e6e5;
  --paper: #fff;
  --wash: #f6f7f7;
  --teal: #496375;
  --teal-dark: #30383c;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-width: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Source Sans 3", "Avenir Next", sans-serif;
}

button,
input,
select {
  font: inherit;
}

.explorer {
  width: 100%;
  min-height: 100vh;
  padding: 14px;
}

html.is-embedded .explorer { min-height: 0; }

.explorer-header {
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 5px 5px 0 0;
  background: #f7f8f8;
}

.dataset-tabs {
  min-height: 48px;
  display: flex;
  align-items: end;
  gap: 2px;
  padding: 0 12px;
  border-bottom: 1px solid var(--line);
}

.dataset-tab {
  position: relative;
  min-height: 47px;
  padding: 0 14px;
  border: 0;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-weight: 650;
}

.dataset-tab::after {
  position: absolute;
  right: 12px;
  bottom: -1px;
  left: 12px;
  height: 3px;
  background: transparent;
  content: "";
}

.dataset-tab.active {
  color: var(--teal-dark);
}

.dataset-tab.active::after {
  background: var(--teal);
}

.dataset-tab span {
  margin-left: 0.3rem;
  color: #87948e;
  font-family: "IBM Plex Mono", monospace;
  font-size: 0.72rem;
}

.dataset-tab:focus-visible {
  outline: 3px solid rgba(73, 99, 117, 0.18);
  outline-offset: -3px;
}

.table-tools {
  min-height: 58px;
  padding: 10px 12px;
  display: grid;
  grid-template-columns: minmax(170px, 1fr) minmax(130px, auto) minmax(130px, auto) auto auto;
  align-items: center;
  gap: 7px;
}

.table-tools input,
.table-tools select,
.table-tools a {
  min-height: 36px;
  border: 1px solid #c6cbca;
  border-radius: 4px;
  background: #fff;
  color: var(--ink);
  font-size: 0.82rem;
}

.table-tools input,
.table-tools select {
  min-width: 0;
  padding: 6px 9px;
}

.table-tools input:focus,
.table-tools select:focus,
.table-tools a:focus-visible {
  border-color: var(--teal);
  outline: 3px solid rgba(73, 99, 117, 0.16);
  outline-offset: 1px;
}

#row-count {
  min-width: 58px;
  color: var(--muted);
  font-size: 0.76rem;
  text-align: right;
  white-space: nowrap;
}

#download-csv {
  padding: 5px 9px;
  display: grid;
  place-items: center;
  cursor: pointer;
  background: #f0f2f2;
  color: var(--teal);
  font-family: "IBM Plex Mono", monospace;
  font-weight: 600;
  text-decoration: none;
}

#download-csv:hover {
  background: #e6e9e8;
}

.table-shell {
  max-height: 515px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 0 0 5px 5px;
  background: #fff;
}

table {
  width: 100%;
  min-width: 760px;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 0.82rem;
  line-height: 1.35;
}

th,
td {
  padding: 10px 11px;
  border-right: 1px solid var(--soft-line);
  border-bottom: 1px solid var(--soft-line);
  text-align: left;
  vertical-align: top;
}

th:last-child,
td:last-child {
  border-right: 0;
}

thead th {
  position: sticky;
  z-index: 2;
  top: 0;
  background: #4b5052;
  color: #fff;
  font-weight: 650;
}

tbody tr:nth-child(even) td {
  background: var(--wash);
}

tbody tr:hover td {
  background: #ecefee;
}

tbody td:first-child {
  font-weight: 650;
}

tr.modality-mesoscope td:first-child {
  border-left: 4px solid #9ea5a2;
}

tr.modality-neuropixels td:first-child {
  border-left: 4px solid #9ea5a2;
}

tr.modality-slap2 td:first-child {
  border-left: 4px solid #9ea5a2;
}

.id-disclosure {
  min-width: 100px;
}

.id-disclosure summary {
  width: max-content;
  cursor: pointer;
  color: #496375;
  font-weight: 650;
  white-space: nowrap;
}

.metadata-list {
  max-width: 340px;
  margin-top: 7px;
  padding: 8px;
  border-left: 3px solid #b5bab8;
  background: #f7f8f8;
  color: #4d5351;
  font-size: 0.72rem;
  font-weight: 400;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.metadata-list dt {
  margin-top: 0.38rem;
  color: #707674;
  font-size: 0.64rem;
  font-weight: 650;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

.metadata-list dt:first-child {
  margin-top: 0;
}

.metadata-list dd {
  margin: 0.08rem 0 0;
}

.empty-state {
  margin: 0;
  padding: 2rem;
  color: var(--muted);
  text-align: center;
}

@media (max-width: 640px) {
  .explorer {
    padding: 8px;
  }

  .table-tools {
    grid-template-columns: 1fr 1fr auto;
  }

  #table-search {
    grid-column: 1 / -1;
  }

  #row-count {
    text-align: left;
  }

  .table-shell {
    max-height: 610px;
  }
}
  </style>
</head>
<body>
  <main class="explorer" id="data-explorer">
    <header class="explorer-header">
      <nav class="dataset-tabs" id="dataset-tabs" aria-label="Choose a data table"></nav>
      <div class="table-tools" role="search">
        <input id="table-search" type="search" placeholder="Search animals" aria-label="Search table">
        <select id="modality-filter" aria-label="Filter by recording modality"></select>
        <select id="context-filter" aria-label="Filter by secondary category"></select>
        <output id="row-count" aria-live="polite"></output>
        <a id="download-csv" href="#" download title="Download visible rows as CSV" aria-label="Download visible rows as CSV">&#8595; CSV</a>
      </div>
    </header>

    <section class="table-shell" aria-live="polite">
      <table id="explorer-table">
        <thead><tr id="table-headers"></tr></thead>
        <tbody id="table-body"></tbody>
      </table>
      <p class="empty-state" id="empty-state" hidden>No matching rows.</p>
    </section>
  </main>

  <script>
(() => {
  "use strict";

  const data = JSON.parse(document.getElementById("explorer-data").textContent);
  const elements = {
    body: document.getElementById("table-body"),
    context: document.getElementById("context-filter"),
    download: document.getElementById("download-csv"),
    empty: document.getElementById("empty-state"),
    headers: document.getElementById("table-headers"),
    modality: document.getElementById("modality-filter"),
    search: document.getElementById("table-search"),
    status: document.getElementById("row-count"),
    tabs: document.getElementById("dataset-tabs"),
  };
  const modalityLabels = {
    mesoscope: "Two-photon",
    neuropixels: "Neuropixels",
    slap2: "SLAP2",
  };
  const state = { kind: "animals", visibleRows: [] };

  function buildTabs() {
    ["animals", "sessions"].forEach((kind) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "dataset-tab";
      button.dataset.kind = kind;
      const label = kind === "animals" ? "Animals" : "Sessions";
      button.innerHTML = `${label}<span>${data.tables[kind].rows.length}</span>`;
      button.addEventListener("click", () => selectTable(kind));
      elements.tabs.append(button);
    });
  }

  function selectTable(kind) {
    state.kind = kind;
    elements.search.value = "";
    elements.search.placeholder = kind === "animals" ? "Search animals" : "Search sessions";
    elements.tabs.querySelectorAll("button").forEach((button) => {
      const active = button.dataset.kind === kind;
      button.classList.toggle("active", active);
      button.setAttribute("aria-pressed", String(active));
    });
    populateFilters();
    renderTable();
  }

  function populateFilters() {
    const rows = data.tables[state.kind].rows;
    setOptions(elements.modality, "All modalities", unique(rows, "modality"), modalityLabels);
    if (state.kind === "sessions") {
      setOptions(elements.context, "All contexts", unique(rows, "context"));
      elements.context.setAttribute("aria-label", "Filter by stimulus context");
    } else {
      setOptions(elements.context, "All QC states", unique(rows, "qc"));
      elements.context.setAttribute("aria-label", "Filter by QC state");
    }
  }

  function renderTable() {
    const table = data.tables[state.kind];
    const query = normalize(elements.search.value);
    state.visibleRows = table.rows.filter((row) => {
      const matchesSearch = !query || normalize(row.csvValues.join(" ")).includes(query);
      const matchesModality = !elements.modality.value
        || row.modality === elements.modality.value;
      const secondaryValue = state.kind === "sessions" ? row.context : row.qc;
      const matchesContext = !elements.context.value
        || secondaryValue === elements.context.value;
      return matchesSearch && matchesModality && matchesContext;
    });

    elements.headers.replaceChildren();
    table.headers.forEach((header) => {
      const cell = document.createElement("th");
      cell.scope = "col";
      cell.textContent = header;
      elements.headers.append(cell);
    });

    elements.body.replaceChildren();
    state.visibleRows.forEach((row) => elements.body.append(renderRow(row, table)));
    elements.status.value = `${state.visibleRows.length} of ${table.rows.length}`;
    elements.status.textContent = elements.status.value;
    elements.empty.hidden = state.visibleRows.length !== 0;
    updateDownloadLink();
  }

  function renderRow(row, table) {
    const tableRow = document.createElement("tr");
    tableRow.className = `modality-${row.modality}`;
    row.values.forEach((value, index) => {
      const cell = document.createElement("td");
      if (index === table.detailsColumn) {
        const details = document.createElement("details");
        details.className = "id-disclosure";
        const summary = document.createElement("summary");
        summary.textContent = "View metadata";
        const list = document.createElement("dl");
        list.className = "metadata-list";
        row.details.forEach((detail) => {
          const term = document.createElement("dt");
          term.textContent = detail.label;
          const description = document.createElement("dd");
          description.textContent = detail.value;
          list.append(term, description);
        });
        details.append(summary, list);
        cell.append(details);
      } else {
        cell.textContent = value;
      }
      tableRow.append(cell);
    });
    return tableRow;
  }

  function setOptions(select, allLabel, values, labels = {}) {
    select.replaceChildren(new Option(allLabel, ""));
    values.forEach((value) => select.append(new Option(labels[value] ?? titleCase(value), value)));
  }

  function unique(rows, key) {
    return Array.from(new Set(rows.map((row) => row[key]).filter(Boolean)));
  }

  function normalize(value) {
    return String(value ?? "").toLowerCase().replace(/\s+/g, " ").trim();
  }

  function titleCase(value) {
    return value.replace(/\b\w/g, (character) => character.toUpperCase());
  }

  function updateDownloadLink() {
    const table = data.tables[state.kind];
    const csv = [table.csvHeaders, ...state.visibleRows.map((row) => row.csvValues)]
      .map((row) => row.map(csvCell).join(","))
      .join("\n");
    elements.download.href = `data:text/csv;charset=utf-8,%EF%BB%BF${encodeURIComponent(csv)}`;
    elements.download.download = `openscope-predictive-processing-${state.kind}.csv`;
  }

  function csvCell(value) {
    return `"${String(value).replaceAll('"', '""')}"`;
  }

  elements.search.addEventListener("input", renderTable);
  elements.modality.addEventListener("change", renderTable);
  elements.context.addEventListener("change", renderTable);
  buildTabs();
  selectTable("animals");
})();
  </script>
  <script>
(() => {
  "use strict";

  const root = document.querySelector("body > main");
  if (!root || window.self === window.top) return;

  let wrapper;
  try {
    wrapper = window.frameElement?.parentElement;
  } catch {
    return;
  }
  if (!wrapper) return;

  document.documentElement.classList.add("is-embedded");
  document.documentElement.style.overflow = "hidden";
  document.body.style.overflow = "hidden";
  const syncHeight = () => {
    const height = Math.ceil(root.getBoundingClientRect().height);
    if (height > 0) wrapper.style.height = `${height}px`;
  };
  const resizeObserver = new ResizeObserver(syncHeight);
  resizeObserver.observe(root);
  window.addEventListener("resize", syncHeight);
  window.addEventListener("load", syncHeight, { once: true });
  syncHeight();
})();
  </script>
